<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL='https://wsqbzxutzafjfwdgybgt.supabase.co';
const SUPABASE_KEY='sb_publishable_Mfd9mO1FPlgECl0QaVnhjw_Fa2m98n5';

const app=document.querySelector('#app');
const toast=document.querySelector('#toast');

let db,me,activeChat,cameraStream,draftPhoto;
let channels=[],connections=new Map(),celebrated=new Set(),messageIds=new Set();

const esc=value=>{
  const node=document.createElement('span');
  node.textContent=value||'';
  return node.innerHTML;
};

const pic=profile=>
  profile.avatar_url||
  'https://placehold.co/240x240/FFE9A8/674C22?text=Egg';

const say=text=>{
  toast.textContent=text;
  toast.classList.add('on');
  clearTimeout(say.timer);
  say.timer=setTimeout(()=>toast.classList.remove('on'),4000);
};

const clear=()=>{
  channels.forEach(channel=>db?.removeChannel(channel));
  channels=[];
};

async function hash(text){
  const digest=await crypto.subtle.digest(
    'SHA-256',
    new TextEncoder().encode(text)
  );

  return [...new Uint8Array(digest)]
    .map(value=>value.toString(16).padStart(2,'0'))
    .join('');
}

function readImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('Could not read that image.'));
    reader.readAsDataURL(file);
  });
}

if(!window.supabase){
  app.innerHTML='<main class="wrap"><h1>Supabase could not load.</h1></main>';
}else{
  db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  boot();
}

async function boot(){
  clear();
  connections=new Map();

  const saved=localStorage.getItem('egg-mates-active-profile');

  if(!saved){
    auth();
    return;
  }

  me=JSON.parse(saved);

  const {data}=await db
    .from('profiles')
    .select('*')
    .eq('id',me.id)
    .maybeSingle();

  if(data){
    me=data;
    localStorage.setItem('egg-mates-active-profile',JSON.stringify(me));
  }

  dashboard();
}

function shell(content){
  app.innerHTML=`
    <main class="wrap">
      <header>
        <b class="brand">🥚 Egg Mates</b>

        <nav class="topnav">
          <button class="navbtn" id="new">👤+ New Eggmates</button>
          <button class="navbtn" id="mine">👥 My Eggmates</button>

          <div class="profile-wrap">
            <button class="navbtn profile-btn" id="profile">◉ Profile</button>

            <div class="menu" id="profile-menu">
              <button id="view">◉ View Profile</button>
              <button id="edit">✎ Edit Profile</button>
              <hr>
              <button id="signout">⇥ Sign Out</button>
              <button id="delete">🗑 Delete Account</button>
            </div>
          </div>
        </nav>
      </header>

      ${content}
    </main>
  `;

  document.querySelector('#new').onclick=showNew;
  document.querySelector('#mine').onclick=dashboard;

  document.querySelector('#profile').onclick=()=>{
    document.querySelector('#profile-menu').classList.toggle('open');
  };

  document.querySelector('#view').onclick=viewProfile;
  document.querySelector('#edit').onclick=editProfile;
  document.querySelector('#signout').onclick=signOut;
  document.querySelector('#delete').onclick=deleteAccount;
}

function auth(){
  clear();

  app.innerHTML=`
    <main class="auth">
      <section class="hero">
        <div style="font-size:62px">🥚</div>
        <h1>Find your other half.</h1>
        <p>Meet your Eggmates.</p>
      </section>

      <section class="card">
        <b class="brand">🥚 Egg Mates</b>
        <div id="auth"></div>
      </section>
    </main>
  `;

  authForm(false);
}

function authForm(signUp){
  draftPhoto='';

  document.querySelector('#auth').innerHTML=`
    <h2>${signUp?'Create a profile':'Welcome back'}</h2>

    <p class="muted">
      ${signUp?'Your public profile appears when you match.':'Sign in on this browser to see your Egg Mates.'}
    </p>

    <form id="login">
      <label>
        Username
        <input name="username" required minlength="3" pattern="[A-Za-z0-9_]+">
      </label>

      <label>
        Password
        <input name="password" type="password" required minlength="8">
      </label>

      ${signUp?`
        <label>
          Full name
          <input name="fullName" required maxlength="80">
        </label>

        <label>
          Upload Photo
          <span class="file">
            🖼 <input name="photo" type="file" accept="image/*">
          </span>
        </label>

        <button type="button" class="secondary" id="signup-camera">
          📷 Take Photo
        </button>

        <div id="signup-preview" class="preview" style="display:none">
          <img id="signup-image" alt="Your new profile photo">
        </div>

        <label>
          Short introduction
          <input name="bio" required maxlength="240">
        </label>
      `:''}

      <button class="primary">${signUp?'Create profile →':'Sign in →'}</button>
    </form>

    <button class="link" id="switch">
      ${signUp?'Already have a profile? Sign in':'New here? Create a profile'}
    </button>
  `;

  document.querySelector('#switch').onclick=()=>authForm(!signUp);

  document.querySelector('input[name="photo"]')?.addEventListener('change',async event=>{
    const file=event.target.files[0];
    if(!file) return;

    try{
      draftPhoto=await readImage(file);
      showSignupPreview();
      say('Photo selected. Complete your profile to continue.');
    }catch(error){
      say(error.message);
    }
  });

  document.querySelector('#signup-camera')?.addEventListener('click',()=>{
    cameraModal(image=>{
      draftPhoto=image;
      showSignupPreview();
      say('Photo captured. Complete your profile to continue.');
    });
  });

  document.querySelector('#login').onsubmit=async event=>{
    event.preventDefault();

    const form=new FormData(event.currentTarget);
    const username=String(form.get('username')).trim();
    const password=String(form.get('password'));
    const button=event.currentTarget.querySelector('.primary');

    button.disabled=true;

    try{
      if(!signUp){
        const account=JSON.parse(
          localStorage.getItem('egg-account-'+username.toLowerCase())||'null'
        );

        if(!account||account.passwordHash!==await hash(password)){
          throw new Error('That username or password is not available in this browser.');
        }

        const {data,error}=await db
          .from('profiles')
          .select('*')
          .eq('id',account.id)
          .maybeSingle();

        if(error||!data) throw new Error('Your profile could not be found.');

        me=data;
        localStorage.setItem('egg-mates-active-profile',JSON.stringify(me));
        dashboard();
        return;
      }

      if(!draftPhoto) throw new Error('Profile photo is required. Use Take Photo or Upload Photo.');
      if(!String(form.get('bio')).trim()) throw new Error('Short introduction is required.');

      if(localStorage.getItem('egg-account-'+username.toLowerCase())){
        throw new Error('That username is already registered in this browser.');
      }

      const profile={
        id:crypto.randomUUID(),
        username,
        full_name:String(form.get('fullName')).trim(),
        bio:String(form.get('bio')).trim(),
        avatar_url:draftPhoto
      };

      const {error}=await db.from('profiles').insert(profile);
      if(error) throw error;

      localStorage.setItem(
        'egg-account-'+username.toLowerCase(),
        JSON.stringify({
          id:profile.id,
          passwordHash:await hash(password)
        })
      );

      me=profile;
      localStorage.setItem('egg-mates-active-profile',JSON.stringify(me));
      dashboard();
    }catch(error){
      say(error.message);
      button.disabled=false;
    }
  };
}

function showSignupPreview(){
  const preview=document.querySelector('#signup-preview');
  const image=document.querySelector('#signup-image');

  if(preview&&image){
    image.src=draftPhoto;
    preview.style.display='flex';
  }
}

function cameraModal(done){
  const modal=document.createElement('div');
  modal.className='modal';

  modal.innerHTML=`
    <section class="modal-card">
      <div class="modal-head">
        <h2>Take Profile Photo</h2>
        <button class="close" id="camera-close">×</button>
      </div>

      <div class="camera" id="camera-box" style="display:block">
        <video id="camera-video" autoplay playsinline></video>

        <div>
          <button class="secondary" id="camera-capture">Capture</button>
          <button class="secondary" id="camera-cancel">Cancel</button>
        </div>
      </div>

      <p class="muted" id="camera-message">Requesting camera permission…</p>
    </section>
  `;

  document.body.append(modal);

  const close=()=>{
    stopCamera();
    modal.remove();
  };

  modal.querySelector('#camera-close').onclick=close;
  modal.querySelector('#camera-cancel').onclick=close;

  modal.querySelector('#camera-capture').onclick=()=>{
    const video=modal.querySelector('#camera-video');

    if(!video.videoWidth){
      say('Camera is still loading. Please wait a moment.');
      return;
    }

    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0);

    const image=canvas.toDataURL('image/jpeg',.88);

    close();
    done(image);
  };

  navigator.mediaDevices.getUserMedia({
    video:{facingMode:'user'},
    audio:false
  }).then(stream=>{
    cameraStream=stream;
    const video=modal.querySelector('#camera-video');
    video.srcObject=stream;
    modal.querySelector('#camera-message').textContent='Position your face, then tap Capture.';
  }).catch(()=>{
    modal.querySelector('#camera-message').textContent=
      'Camera access was denied or unavailable. Please use Upload Photo instead.';
    modal.querySelector('#camera-capture').disabled=true;
  });
}

function stopCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
    cameraStream=null;
  }
}

function dashboard(){
  clear();

  shell(`
    <section class="dash">
      <div class="tag">✦ The surprise is waiting</div>
      <h1>Hey, ${esc(me.full_name.split(' ')[0])}.</h1>
      <p>Enter another secret code, or chat with one of your Egg Mates.</p>

      <form class="codeform" id="code">
        <label>
          Enter Your Secret Code
          <input name="value" required maxlength="64" placeholder="e.g. SUNNY-42">
        </label>

        <button class="primary">Find my mate →</button>
      </form>

      <section class="connections">
        <h2>My Eggmates</h2>
        <div id="list"><p class="empty">Loading your Egg Mates…</p></div>
      </section>
    </section>
  `);

  document.querySelector('#code').onsubmit=claim;
  loadConnections();
  watchMatches();
}

function showNew(){
  dashboard();
  setTimeout(()=>document.querySelector('#code input')?.focus(),0);
}

async function loadConnections(){
  const {data,error}=await db
    .from('codes')
    .select('*')
    .or(`user_id1.eq.${me.id},user_id2.eq.${me.id}`)
    .eq('status','matched');

  if(error) return say(error.message);

  for(const code of data||[]) await addConnection(code,false);
  renderConnections();
}

async function addConnection(code,isNew){
  if(
    code.status!=='matched'||
    (code.user_id1!==me.id&&code.user_id2!==me.id)||
    connections.has(code.chat_id)
  ) return;

  const otherId=code.user_id1===me.id?code.user_id2:code.user_id1;

  const {data:other,error}=await db
    .from('profiles')
    .select('*')
    .eq('id',otherId)
    .single();

  if(error||!other) return;

  const connection={chatId:code.chat_id,other};
  connections.set(connection.chatId,connection);

  if(isNew){
    renderConnections();
    confirmConnection(connection);
  }

  return connection;
}

function renderConnections(){
  const list=document.querySelector('#list');
  if(!list) return;

  const all=[...connections.values()];

  list.innerHTML=all.length
    ?all.map(connection=>`
      <article class="connection">
        <img src="${esc(pic(connection.other))}" alt="${esc(connection.other.full_name)}">

        <div>
          <b>${esc(connection.other.full_name)}</b>
          <small>@${esc(connection.other.username)} · Egg Mate</small>
        </div>

        <button class="primary" data-chat="${connection.chatId}">Chat</button>
      </article>
    `).join('')
    :'<p class="empty">No Egg Mates yet. Your next code could change that.</p>';

  list.querySelectorAll('[data-chat]').forEach(button=>{
    button.onclick=()=>openChat(button.dataset.chat);
  });
}

function watchMatches(){
  const channel=db.channel('matches-'+me.id).on(
    'postgres_changes',
    {event:'UPDATE',schema:'public',table:'codes'},
    async payload=>{
      const code=payload.new;

      if(
        code.status==='matched'&&
        (code.user_id1===me.id||code.user_id2===me.id)
      ){
        await addConnection(code,true);
      }
    }
  ).subscribe();

  channels.push(channel);
}

async function claim(event){
  event.preventDefault();

  const button=event.currentTarget.querySelector('button');
  button.disabled=true;

  try{
    const {data,error}=await db.rpc('claim_secret_code',{
      entered_code:event.currentTarget.value.value.trim().toUpperCase(),
      claimant_id:me.id
    });

    if(error) throw error;

    const result=data[0];

    if(result.result==='redeemed'){
      return say('This code has already been redeemed by two Egg Mates!');
    }

    if(result.result==='own_code'){
      return say('You already entered this code. It is waiting for your Egg Mate.');
    }

    if(result.result==='waiting'){
      return say('Your code is saved! We’ll reveal your Egg Mate when they arrive.');
    }

    const {data:other,error:profileError}=await db
      .from('profiles')
      .select('*')
      .eq('id',result.other_user_id)
      .single();

    if(profileError) throw profileError;

    const connection={chatId:result.chat_id,other};

    if(!connections.has(connection.chatId)){
      connections.set(connection.chatId,connection);
      renderConnections();
    }

    confirmConnection(connection);
  }catch(error){
    say(error.message);
  }finally{
    button.disabled=false;
  }
}

function confirmConnection(connection){
  if(celebrated.has(connection.chatId)) return;

  celebrated.add(connection.chatId);
  celebrate();

  shell(`
    <section class="match">
      <div class="tag">✦ It’s a match!</div>
      <h1>Your egg puff sticks led here.</h1>
      <p>Say hello to the person who found the other half of your secret.</p>

      <div class="people">
        ${person(me)}
        <div class="egg">🥚</div>
        ${person(connection.other)}
      </div>

      <button class="primary" id="chat">💬 Start Chatting</button>
      <button class="link" id="back">View all my Eggmates</button>
    </section>
  `);

  document.querySelector('#chat').onclick=()=>openChat(connection.chatId);
  document.querySelector('#back').onclick=dashboard;
}

function person(profile){
  return `
    <article class="person">
      <img src="${esc(pic(profile))}" alt="${esc(profile.full_name)}">
      <h2>${esc(profile.full_name)}</h2>
      <span>@${esc(profile.username)}</span>
      <p>${esc(profile.bio)}</p>
    </article>
  `;
}

async function openChat(chatId){
  const connection=connections.get(chatId);

  if(!connection) return say('This chat could not be opened.');

  clear();
  activeChat=connection;
  messageIds=new Set();

  shell(`
    <section class="chat">
      <div class="chathead">
        <img src="${esc(pic(connection.other))}">

        <div>
          <b>${esc(connection.other.full_name)}</b>
          <small>Your Egg Mate</small>
        </div>
      </div>

      <div class="messages" id="msgs">
        <p class="empty">Break the ice — your Egg Mate is here.</p>
      </div>

      <form class="send" id="send">
        <input name="body" placeholder="Write a message…" required maxlength="2000">
        <button aria-label="Send message">➤</button>
      </form>
    </section>
  `);

  await loadMessages();

  const channel=db.channel('chat-'+chatId).on(
    'postgres_changes',
    {
      event:'INSERT',
      schema:'public',
      table:'messages',
      filter:'chat_id=eq.'+chatId
    },
    payload=>addMessage(payload.new)
  ).subscribe();

  channels.push(channel);

  document.querySelector('#send').onsubmit=async event=>{
    event.preventDefault();

    const input=event.currentTarget.body;
    const body=input.value.trim();

    if(!body) return;

    input.value='';

    const {error}=await db.from('messages').insert({
      chat_id:chatId,
      sender_id:me.id,
      body
    });

    if(error){
      input.value=body;
      say(error.message);
    }
  };
}

async function loadMessages(){
  const {data,error}=await db
    .from('messages')
    .select('id,sender_id,body,created_at')
    .eq('chat_id',activeChat.chatId)
    .order('created_at')
    .limit(100);

  if(error) return say(error.message);

  const box=document.querySelector('#msgs');
  box.innerHTML='';

  (data||[]).forEach(addMessage);
}

function addMessage(message){
  if(messageIds.has(message.id)) return;

  messageIds.add(message.id);

  const box=document.querySelector('#msgs');
  if(!box) return;

  box.querySelector('.empty')?.remove();

  const bubble=document.createElement('div');
  bubble.className='bubble '+(message.sender_id===me.id?'mine':'');
  bubble.textContent=message.body;

  box.append(bubble);

  requestAnimationFrame(()=>{
    box.scrollTop=box.scrollHeight;
  });
}

function viewProfile(){
  document.querySelector('#profile-menu').classList.remove('open');

  const modal=document.createElement('div');
  modal.className='modal';

  modal.innerHTML=`
    <section class="modal-card">
      <div class="modal-head">
        <h2>My Profile</h2>
        <button class="close">×</button>
      </div>

      <div class="preview"><img src="${esc(pic(me))}"></div>

      <h2 style="text-align:center;margin:0">${esc(me.full_name)}</h2>
      <p style="text-align:center;color:#a27a2e">@${esc(me.username)}</p>
      <p style="text-align:center;color:#79674d">${esc(me.bio)}</p>

      <button class="primary" id="edit-now" style="width:100%">Edit Profile</button>
    </section>
  `;

  document.body.append(modal);

  modal.querySelector('.close').onclick=()=>modal.remove();
  modal.querySelector('#edit-now').onclick=()=>{
    modal.remove();
    editProfile();
  };
}

function editProfile(){
  document.querySelector('#profile-menu')?.classList.remove('open');

  draftPhoto=me.avatar_url||'';

  const modal=document.createElement('div');
  modal.className='modal';

  modal.innerHTML=`
    <section class="modal-card">
      <div class="modal-head">
        <h2>Edit Profile</h2>
        <button class="close">×</button>
      </div>

      <div class="preview"><img id="preview" src="${esc(pic(me))}"></div>

      <div class="photo-actions">
        <button class="secondary" id="take">📷 Take Photo</button>
        <button class="secondary" id="upload">🖼 Upload Photo</button>
      </div>

      <input id="file" type="file" accept="image/*" hidden>

      <form id="edit-form">
        <label>
          Short introduction
          <textarea id="bio" maxlength="240">${esc(me.bio||'')}</textarea>
        </label>

        <div class="validation" id="validation"></div>

        <div class="actions">
          <button type="button" class="secondary" id="cancel">Cancel</button>
          <button class="primary" id="save">Save Profile</button>
        </div>
      </form>
    </section>
  `;

  document.body.append(modal);

  const close=()=>{
    stopCamera();
    modal.remove();
  };

  modal.querySelector('.close').onclick=close;
  modal.querySelector('#cancel').onclick=close;

  modal.querySelector('#upload').onclick=()=>modal.querySelector('#file').click();

  modal.querySelector('#file').onchange=async event=>{
    const file=event.target.files[0];
    if(!file) return;

    draftPhoto=await readImage(file);
    modal.querySelector('#preview').src=draftPhoto;
    say('Photo selected. Save your profile to update it.');
  };

  modal.querySelector('#take').onclick=()=>{
    cameraModal(image=>{
      draftPhoto=image;
      modal.querySelector('#preview').src=image;
      say('Photo captured. Save your profile to update it.');
    });
  };

  modal.querySelector('#edit-form').onsubmit=async event=>{
    event.preventDefault();

    const bio=modal.querySelector('#bio').value.trim();
    const validation=modal.querySelector('#validation');
    const save=modal.querySelector('#save');

    const errors=[];
    if(!draftPhoto) errors.push('Profile photo is required.');
    if(!bio) errors.push('Short introduction is required.');

    if(errors.length){
      validation.textContent=errors.join(' ');
      validation.classList.add('show');
      return;
    }

    save.disabled=true;
    save.textContent='Saving…';

    const {error}=await db
      .from('profiles')
      .update({avatar_url:draftPhoto,bio})
      .eq('id',me.id);

    if(error){
      say(error.message);
      save.disabled=false;
      save.textContent='Save Profile';
      return;
    }

    me.avatar_url=draftPhoto;
    me.bio=bio;

    localStorage.setItem('egg-mates-active-profile',JSON.stringify(me));

    modal.remove();
    say('Profile updated successfully.');
    dashboard();
  };
}

function signOut(){
  if(!confirm('Are you sure you want to sign out?')) return;

  clear();
  connections=new Map();
  localStorage.removeItem('egg-mates-active-profile');

  say('You have been signed out.');
  boot();
}

async function deleteAccount(){
  const confirmed=confirm(
    'Delete your account permanently? Your profile and associated messages will be deleted. This cannot be undone.'
  );

  if(!confirmed) return;

  try{
    await db.from('messages').delete().eq('sender_id',me.id);

    const {error}=await db
      .from('profiles')
      .delete()
      .eq('id',me.id);

    if(error) throw error;
  }catch(error){
    say('Your account could not be deleted: '+error.message);
    return;
  }

  clear();

  localStorage.removeItem('egg-mates-active-profile');
  localStorage.removeItem('egg-account-'+me.username.toLowerCase());

  connections=new Map();

  say('Your account has been deleted.');
  boot();
}

function celebrate(){
  const box=document.createElement('div');
  box.className='confetti';

  for(let index=0;index<80;index++){
    const piece=document.createElement('i');

    piece.textContent=['🎉','✨','🥚','💛','🍳'][index%5];
    piece.style.left=Math.random()*100+'vw';
    piece.style.setProperty('--x',(Math.random()*280-140)+'px');
    piece.style.animationDelay=Math.random()*.4+'s';

    box.append(piece);
  }

  document.body.append(box);
  setTimeout(()=>box.remove(),3200);

  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    const audio=new AudioContextClass();
    const oscillator=audio.createOscillator();
    const gain=audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.type='square';
    oscillator.frequency.setValueAtTime(180,audio.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(60,audio.currentTime+.1);

    gain.gain.setValueAtTime(.6,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);

    oscillator.start();
    oscillator.stop(audio.currentTime+.15);
  }catch(error){}
}
</script>
