<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Egg Mates</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:#513c19;background:#fffaf0}button,input{font:inherit}button{border:0;cursor:pointer}.wrap{max-width:1000px;margin:auto;padding:24px;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:700;color:#694b24}.ghost,.link{background:none;color:#8f6b30}.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}.hero{background:#f5c957;padding:12vh 8vw;color:#5d421e}.hero h1,h1,h2{font-family:'Playfair Display',serif}.hero h1{font-size:clamp(42px,6vw,70px);line-height:1.03}.card{max-width:450px;width:100%;margin:auto;padding:42px 28px}.card h2{font-size:36px;margin:35px 0 5px}.muted,.hint{color:#897558}form{display:grid;gap:14px;margin-top:24px}label{font-size:14px;font-weight:700;display:grid;gap:7px}input{border:1px solid #e3d3b6;border-radius:12px;padding:13px;background:#fff;outline:none}input:focus{border-color:#d69e23;box-shadow:0 0 0 3px #ffe9a4}.file{border:1px dashed #c9a55c;padding:11px;border-radius:12px}.file input{border:0;padding:0}.primary{background:#e9b635;color:#523d18;border-radius:13px;padding:14px 18px;font-weight:700;box-shadow:0 5px #c78e1f}.primary:disabled{opacity:.6}.link{display:block;margin:21px auto}.dash,.match{text-align:center;max-width:750px;margin:11vh auto}.tag{display:inline-block;padding:8px 12px;background:#fff0bc;color:#967018;border-radius:999px;font-size:14px;font-weight:700}.dash h1,.match h1{font-size:clamp(42px,7vw,64px);margin:15px 0 8px}.dash>p,.match>p{font-size:18px;line-height:1.55;color:#806e54}.codeform{max-width:530px;text-align:left;margin:32px auto}.codeform input{text-transform:uppercase;font-size:19px;letter-spacing:2px}.people{display:flex;align-items:center;justify-content:center;gap:25px;margin:36px 0}.person{background:#fff;width:270px;padding:23px;border-radius:23px;box-shadow:0 12px 34px #a67d2b22;animation:pop .6s both}.person:last-child{animation-delay:.18s}.person img{width:130px;height:130px;border-radius:50%;object-fit:cover;border:6px solid #fff1bd}.person h2{margin:10px 0 0}.person span{color:#a27a2e}.person p{color:#79674d;line-height:1.5}.egg{background:#f5c957;border-radius:50%;padding:17px;font-size:26px}@keyframes pop{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}.chat{max-width:700px;height:calc(100vh - 105px);max-height:680px;margin:25px auto;background:#fff;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 35px #a67d2b22}.chathead{padding:16px 20px;border-bottom:1px solid #eee2ca;display:flex;gap:10px;align-items:center}.chathead img{width:42px;height:42px;border-radius:50%;object-fit:cover}.chathead small{display:block;color:#a17d40}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:#fffdf8}.bubble{background:#f7ead1;padding:10px 14px;border-radius:16px 16px 16px 3px;width:max-content;max-width:72%}.mine{align-self:flex-end;background:#f5c957;border-radius:16px 16px 3px 16px}.empty{margin:auto;color:#9c8667}.send{display:grid;grid-template-columns:1fr 50px;gap:8px;padding:14px;margin:0;border-top:1px solid #eee2ca}.send button{border-radius:12px;background:#e9b635}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,110px);background:#4e3921;color:#fff;padding:14px 20px;border-radius:12px;transition:.25s;max-width:90vw}.toast.on{transform:translate(-50%,0)}.setup{max-width:650px;margin:15vh auto;padding:28px;background:#fff;border-radius:18px}@media(max-width:700px){.auth{display:block}.hero{min-height:260px;padding:45px 28px}.hero h1{font-size:43px}.card{padding:30px 24px}.wrap{padding:16px}.dash,.match{margin:60px auto}.people{gap:10px}.person{width:calc(50% - 17px);padding:14px}.person img{width:82px;height:82px}.person h2{font-size:19px}.person p{font-size:14px}.egg{padding:9px;font-size:18px}.chat{margin:18px 0;height:calc(100vh - 80px)}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Replace these two values with your Supabase Project Settings > API values.
const SUPABASE_URL='https://wsqbzxutzafjfwdgybgt.supabase.co',SUPABASE_KEY='sb_publishable_Mfd9mO1FPlgECl0QaVnhjw_Fa2m98n5';
const app=document.querySelector('#app'),toast=document.querySelector('#toast');let db,me,match,ch;
const e=s=>{const x=document.createElement('span');x.textContent=s||'';return x.innerHTML},pic=p=>p.avatar_url||'https://placehold.co/240x240/FFE9A8/674C22?text=Egg';
const say=s=>{toast.textContent=s;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('on'),4000)},clear=()=>{if(ch)db.removeChannel(ch);ch=null};
async function hash(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function imageData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Could not read that image.'));reader.readAsDataURL(file)})}
if(SUPABASE_URL.includes('YOUR-'))app.innerHTML='<main class="setup"><h1>Add your Supabase keys</h1><p>Edit <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> near the bottom of this index.html file.</p></main>';else if(!window.supabase)app.innerHTML='<main class="setup"><h1>Could not load Supabase</h1><p>Open this site using VS Code Live Server, then check that your internet connection allows cdn.jsdelivr.net.</p></main>';else{db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);boot()}
async function boot(){clear();let s=localStorage.getItem('egg-mates-active-profile');if(!s)return auth();me=JSON.parse(s);let{data}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();if(data){me=data;localStorage.setItem('egg-mates-active-profile',JSON.stringify(me))}dashboard()}
function shell(x){app.innerHTML=`<main class="wrap"><header><b class="brand">🥚 Egg Mates</b><button class="ghost" id="out">↪ Sign out</button></header>${x}</main>`;document.querySelector('#out').onclick=()=>{localStorage.removeItem('egg-mates-active-profile');boot()}}
function auth(){clear();app.innerHTML='<main class="auth"><section class="hero"><div style="font-size:62px">🥚</div><h1>Two sticks.<br>One tiny world.</h1><p>Find the person who discovered your matching secret code.</p></section><section class="card"><b class="brand">🥚 Egg Mates</b><div id="form"></div></section></main>';authform(false)}
function authform(sign){document.querySelector('#form').innerHTML=`<h2>${sign?'Create a demo profile':'Welcome back'}</h2><p class="muted">${sign?'No email or Supabase authentication needed. Your public demo profile will be shared with your Egg Mate.':'Sign in to your browser-only demo profile.'}</p><form id="login"><label>Username<input name="u" required minlength="3" pattern="[A-Za-z0-9_]+"></label><label>Password<input name="p" type="password" required minlength="8"></label>${sign?'<label>Full name<input name="n" required maxlength="80"></label><label>Profile photo<span class="file">▧ <input name="photo" type="file" accept="image/*" required></span></label><label>Short bio<input name="bio" required maxlength="240"></label>':''}<button class="primary">${sign?'Create demo profile →':'Demo sign in →'}</button></form><button class="link" id="switch">${sign?'Already have a demo profile? Sign in':'New here? Create a demo profile'}</button>`;document.querySelector('#switch').onclick=()=>authform(!sign);document.querySelector('#login').onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.currentTarget),u=String(f.get('u')).trim(),p=String(f.get('p')),b=ev.currentTarget.querySelector('button');b.disabled=true;try{if(!sign){let a=JSON.parse(localStorage.getItem('egg-account-'+u.toLowerCase())||'null');if(!a||a.h!==await hash(p))throw Error('That username or password is not available in this browser.');let{data,error}=await db.from('profiles').select('*').eq('id',a.id).maybeSingle();if(error)throw error;if(!data){let old=JSON.parse(localStorage.getItem('egg-profile-'+a.id)||localStorage.getItem('egg-mates-active-profile')||'null');if(!old)throw Error('Create a fresh demo profile in this browser.');let{error:publishError}=await db.from('profiles').insert(old);if(publishError)throw Error('Run egg_mates_demo_setup.sql in Supabase SQL Editor, then try again.');data=old}localStorage.setItem('egg-mates-active-profile',JSON.stringify(data));boot()}else{let photo=f.get('photo');if(!(photo instanceof File)||!photo.size)throw Error('Please choose a profile photo.');if(localStorage.getItem('egg-account-'+u.toLowerCase()))throw Error('That username is already registered in this browser.');let id=crypto.randomUUID(),obj={id,username:u,full_name:String(f.get('n')).trim(),bio:String(f.get('bio')).trim(),avatar_url:await imageData(photo)},{error}=await db.from('profiles').insert(obj);if(error)throw Error('Could not save the shared demo profile. Run egg_mates_demo_setup.sql in Supabase SQL Editor, then try again.');localStorage.setItem('egg-account-'+u.toLowerCase(),JSON.stringify({id,h:await hash(p)}));localStorage.setItem('egg-profile-'+id,JSON.stringify(obj));localStorage.setItem('egg-mates-active-profile',JSON.stringify(obj));boot()}}catch(x){say(x.message);b.disabled=false}}}
function dashboard(){shell(`<section class="dash"><div class="tag">✦ The surprise is waiting</div><h1>Hey, ${e(me.full_name.split(' ')[0])}.</h1><p>Enter the secret code from your egg puff stick. If someone found its twin, we’ll introduce you.</p><form class="codeform" id="code"><label>Enter Your Secret Code<input name="v" required maxlength="64" placeholder="e.g. SUNNY-42"></label><button class="primary">Find my mate →</button></form><p class="hint">Each code can connect exactly two Egg Mates.</p></section>`);document.querySelector('#code').onsubmit=claim;ch=db.channel('matches-'+me.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'codes',filter:'user_id1=eq.'+me.id},async p=>{if(p.new.status==='matched')reveal(p.new.user_id2,p.new.chat_id)}).subscribe()}
async function claim(ev){ev.preventDefault();let b=ev.currentTarget.querySelector('button');b.disabled=true;try{let{data,error}=await db.rpc('claim_secret_code',{entered_code:ev.currentTarget.v.value.trim().toUpperCase(),claimant_id:me.id});if(error)throw error;let r=data[0];if(r.result==='redeemed')return say('This code has already been redeemed by two Egg Mates!');if(r.result==='own_code')return say('You already entered this code. It is waiting for your Egg Mate.');if(r.result==='waiting')return say('Your code is saved! We’ll reveal your Egg Mate when they arrive.');reveal(r.other_user_id,r.chat_id)}catch(x){say(x.message)}finally{b.disabled=false}}
const person=p=>`<article class="person"><img src="${e(pic(p))}"><h2>${e(p.full_name)}</h2><span>@${e(p.username)}</span><p>${e(p.bio)}</p></article>`;
async function reveal(id,chat){let{data,error}=await db.from('profiles').select('*').eq('id',id).single();if(error)return say(error.message);match={other:data,chat};clear();shell(`<section class="match"><div class="tag">✦ It’s a match!</div><h1>Your egg puff sticks led here.</h1><p>Say hello to the person who found the other half of your secret.</p><div class="people">${person(me)}<div class="egg">🥚</div>${person(data)}</div><button class="primary" id="chat">💬 Start Chatting</button></section>`);document.querySelector('#chat').onclick=chatroom}
function chatroom(){shell(`<section class="chat"><div class="chathead"><img src="${e(pic(match.other))}"><div><b>${e(match.other.full_name)}</b><small>Your Egg Mate</small></div></div><div class="messages" id="msgs"><p class="empty">Break the ice — your Egg Mate is here.</p></div><form class="send" id="send"><input name="b" placeholder="Write a message…" required maxlength="2000"><button>➤</button></form></section>`);load();ch=db.channel('chat-'+match.chat).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'chat_id=eq.'+match.chat},p=>add(p.new)).subscribe();document.querySelector('#send').onsubmit=async ev=>{ev.preventDefault();let i=ev.currentTarget.b,t=i.value.trim();if(!t)return;i.value='';let{error}=await db.from('messages').insert({chat_id:match.chat,sender_id:me.id,body:t});if(error){i.value=t;say(error.message)}}}
async function load(){let{data}=await db.from('messages').select('*').eq('chat_id',match.chat).order('created_at'),x=document.querySelector('#msgs');x.innerHTML='';(data||[]).forEach(add)}function add(m){let x=document.querySelector('#msgs');if(!x)return;x.querySelector('.empty')?.remove();let d=document.createElement('div');d.className='bubble '+(m.sender_id===me.id?'mine':'');d.textContent=m.body;x.append(d);x.scrollTop=x.scrollHeight}
</script></body></html>
